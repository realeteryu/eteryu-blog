# konfiguracja projektu
[project]
site_name = "Eteryu.space"
site_description = "Blog o cyfrowej higienie, prywatności i bezpieczeństwie."
site_author = "Eteryu"
site_url = "https://eteryu.space/"
copyright = """Copyright &copy; 2026 Eteryu · Blog o cyfrowej higienie<br>Treść na licencji <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a><br><a href="mailto:kontakt@distrust.pl">kontakt@distrust.pl</a>"""

# podpięcie własnego css
extra_css = ["assets/css/extra.css"]

# nawigacja
nav = [
    { "Blog" = "index.md" },
    { "Katalog" = "katalog.md" },
]

# motyw
[project.theme]
variant = "modern"
custom_dir = "overrides"
language = "pl"
font = false

features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

# paleta kolorów (tryb ciemny/jasny)
[[project.theme.palette]]
primary = "indigo"
accent = "indigo"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Przełącz na tryb jasny"

[[project.theme.palette]]
primary = "indigo"
accent = "indigo"
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Przełącz na tryb ciemny"

# ustawienia dodatkowe
[project.extra]
generator = false

# linki społecznościowe
[[project.extra.social]]
icon = "fontawesome/solid/rss"
link = "/feed_rss_created.xml"
name = "Kanał RSS"

[[project.extra.social]]
icon = "fontawesome/brands/mastodon"
link = "https://101010.pl/@Eteryu"
name = "Mastodon"

[[project.extra.social]]
icon = "fontawesome/solid/link"
link = "https://distrust.pl"
name = "Distrust"

# rozszerzenia markdown
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]

# blog
[project.plugins.blog]
blog_dir = "."
post_url_format = "{slug}"
pagination_per_page = 10

# kanał rss
[project.plugins.rss]
match_path = "posts/.*"
abstract_chars_count = -1
date_from_meta = { as_creation = "date" }
